name: Checks

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

jobs:
  checks:
    name: Format, lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci`, never `--omit=dev`: there are no runtime dependencies, but the
      # pipeline is TypeScript run through tsx, which is a devDependency.
      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
